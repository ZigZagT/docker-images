    environment: action-build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge dnsmasq-exporter
        if: needs.detect-changes.outputs.dnsmasq-exporter == 'true'
        run: |
          make merge-dnsmasq-exporter
      - name: Merge sqitch-pg
        if: needs.detect-changes.outputs.sqitch-pg == 'true'
        run: |
          make merge-sqitch-pg
      - name: Merge wait-for-pg
        if: needs.detect-changes.outputs.wait-for-pg == 'true'
        run: |
          make merge-wait-for-pg
      - name: Sync dnsmasq_exporter README
        if: needs.detect-changes.outputs.dnsmasq-exporter == 'true'
        run: ./scripts/sync-readme.sh dnsmasq_exporter/README.md ${{ vars.DOCKERHUB_USERNAME }}/dnsmasq_exporter
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync sqitch-pg README
        if: needs.detect-changes.outputs.sqitch-pg == 'true'
        run: ./scripts/sync-readme.sh sqitch-pg/README.md ${{ vars.DOCKERHUB_USERNAME }}/sqitch-pg
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync wait-for-pg README
        if: needs.detect-changes.outputs.wait-for-pg == 'true'
