name: Build and Push Docker Images

concurrency:
  group: build-and-push
  cancel-in-progress: false

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      upstream_tags:
        description: 'Ubuntu versions to build (space-separated)'
        required: false
        default: '22.04 24.04 26.04'
        type: string
      latest_tag:
        description: 'Which Ubuntu version should the "latest" tag point to'
        required: false
        default: '24.04'
        type: string
      nodejs_versions:
        description: 'Node.js versions to build (space-separated)'
        required: false
        default: '22 24'
        type: string
      default_nodejs_version:
        description: 'Which Node.js version should the default "nodejs" tag point to'
        required: false
        default: '24'
        type: string
      tz:
        description: 'Default timezone configured in the images'
        required: false
        default: 'America/Vancouver'
        type: string
      apt_mirror:
        description: 'Default APT mirror URL (leave empty for default Ubuntu mirrors)'
        required: false
        default: ''
        type: string
      qemu_versions:
        description: 'QEMU versions to build (space-separated)'
        required: false
        default: '10.2.1'
        type: string
      qemu_latest:
        description: 'Which QEMU version should the "latest" tag point to'
        required: false
        default: '10.2.1'
        type: string
      ch_versions:
        description: 'Cloud Hypervisor versions to build (space-separated)'
        required: false
        default: '51.1'
        type: string
      ch_latest:
        description: 'Which Cloud Hypervisor version should the "latest" tag point to'
        required: false
        default: '51.1'
        type: string
  schedule:
    # At 00:00 on Saturday https://crontab.guru/#0_0_*_*_6
    - cron: '0 0 * * 6'

env:
  UPSTREAM_TAGS: ${{ github.event.inputs.upstream_tags || '22.04 24.04 26.04' }}
  LATEST_TAG: ${{ github.event.inputs.latest_tag || '24.04' }}
  NODEJS_VERSIONS: ${{ github.event.inputs.nodejs_versions || '22 24' }}
  DEFAULT_NODEJS_VERSION: ${{ github.event.inputs.default_nodejs_version || '24' }}
  TZ: ${{ github.event.inputs.tz || 'America/Vancouver' }}
  APT_MIRROR: ${{ github.event.inputs.apt_mirror || '' }}
  QEMU_VERSIONS: ${{ github.event.inputs.qemu_versions || '10.2.1' }}
  QEMU_LATEST: ${{ github.event.inputs.qemu_latest || '10.2.1' }}
  CH_VERSIONS: ${{ github.event.inputs.ch_versions || '51.1' }}
  CH_LATEST: ${{ github.event.inputs.ch_latest || '51.1' }}

jobs:
  detect-changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    environment: action-build-and-push
    outputs:
      ubuntu: ${{ steps.changes.outputs.ubuntu }}
      ubuntu-geoip: ${{ steps.changes.outputs.ubuntu-geoip }}
      shadowsocks: ${{ steps.changes.outputs.shadowsocks }}
      dnsmasq: ${{ steps.changes.outputs.dnsmasq }}
      qemu: ${{ steps.changes.outputs.qemu }}
      cloud-hypervisor: ${{ steps.changes.outputs.cloud-hypervisor }}
      dnsmasq-exporter: ${{ steps.changes.outputs.dnsmasq-exporter }}
      sqitch-pg: ${{ steps.changes.outputs.sqitch-pg }}
      wait-for-pg: ${{ steps.changes.outputs.wait-for-pg }}
      browser: ${{ steps.changes.outputs.browser }}
      any-changes: ${{ steps.changes.outputs.any-changes }}
      upstream-tags-json: ${{ steps.matrices.outputs.upstream_tags_json }}
      settings: ${{ steps.settings.outputs.json }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get last successful build commit
        id: last-build
        run: |
          # Try to get the commit SHA from the last successful workflow run
          LAST_SUCCESS=$(gh run list \
            --workflow=build-and-push.yml \
            --branch=master \
            --status=success \
            --limit=1 \
            --json headSha \
            --jq '.[0].headSha' 2>/dev/null || echo "")

          if [[ -n "$LAST_SUCCESS" ]]; then
            echo "last-success-sha=$LAST_SUCCESS" >> $GITHUB_OUTPUT
            echo "Found last successful build at commit: $LAST_SUCCESS"
          else
            echo "last-success-sha=" >> $GITHUB_OUTPUT
            echo "No previous successful build found"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Detect changes
        id: changes
        run: |
          # For scheduled runs or manual triggers, build all images
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ubuntu=true" >> $GITHUB_OUTPUT
            echo "ubuntu-geoip=true" >> $GITHUB_OUTPUT
            echo "shadowsocks=true" >> $GITHUB_OUTPUT
            echo "dnsmasq=true" >> $GITHUB_OUTPUT
            echo "qemu=true" >> $GITHUB_OUTPUT
            echo "cloud-hypervisor=true" >> $GITHUB_OUTPUT
            echo "browser=true" >> $GITHUB_OUTPUT
            echo "dnsmasq-exporter=true" >> $GITHUB_OUTPUT
            echo "sqitch-pg=true" >> $GITHUB_OUTPUT
            echo "wait-for-pg=true" >> $GITHUB_OUTPUT
            echo "any-changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine base reference for comparison
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs, compare against base branch
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            # For pushes, use last successful build commit
            if [[ -n "${{ steps.last-build.outputs.last-success-sha }}" ]]; then
              BASE_REF="${{ steps.last-build.outputs.last-success-sha }}"
              echo "Comparing against last successful build: $BASE_REF"
            else
              # No previous successful build found - build everything to be safe
              echo "No previous successful build found, building all images"
              echo "ubuntu=true" >> $GITHUB_OUTPUT
              echo "ubuntu-geoip=true" >> $GITHUB_OUTPUT
              echo "shadowsocks=true" >> $GITHUB_OUTPUT
              echo "dnsmasq=true" >> $GITHUB_OUTPUT
              echo "qemu=true" >> $GITHUB_OUTPUT
              echo "cloud-hypervisor=true" >> $GITHUB_OUTPUT
              echo "browser=true" >> $GITHUB_OUTPUT
              echo "dnsmasq-exporter=true" >> $GITHUB_OUTPUT
              echo "sqitch-pg=true" >> $GITHUB_OUTPUT
              echo "wait-for-pg=true" >> $GITHUB_OUTPUT
              echo "any-changes=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Check each image directory for changes
          ANY_CHANGES=false

          if ./scripts/has-git-diff-at-path.sh ubuntu "$BASE_REF"; then
            echo "ubuntu=true" >> $GITHUB_OUTPUT
            echo "ubuntu-geoip=true" >> $GITHUB_OUTPUT  # geoip depends on base
            echo "shadowsocks=true" >> $GITHUB_OUTPUT    # depends on ubuntu:rust
            echo "dnsmasq=true" >> $GITHUB_OUTPUT        # depends on ubuntu
            echo "qemu=true" >> $GITHUB_OUTPUT           # depends on ubuntu
            echo "cloud-hypervisor=true" >> $GITHUB_OUTPUT # depends on ubuntu
            echo "browser=true" >> $GITHUB_OUTPUT        # depends on ubuntu:nodejs
            ANY_CHANGES=true
          else
            echo "ubuntu=false" >> $GITHUB_OUTPUT
            if ./scripts/has-git-diff-at-path.sh ubuntu-geoip "$BASE_REF"; then
              echo "ubuntu-geoip=true" >> $GITHUB_OUTPUT
              ANY_CHANGES=true
            else
              echo "ubuntu-geoip=false" >> $GITHUB_OUTPUT
            fi

            if ./scripts/has-git-diff-at-path.sh shadowsocks "$BASE_REF"; then
              echo "shadowsocks=true" >> $GITHUB_OUTPUT
              ANY_CHANGES=true
            else
              echo "shadowsocks=false" >> $GITHUB_OUTPUT
            fi

            if ./scripts/has-git-diff-at-path.sh dnsmasq "$BASE_REF"; then
              echo "dnsmasq=true" >> $GITHUB_OUTPUT
              ANY_CHANGES=true
            else
              echo "dnsmasq=false" >> $GITHUB_OUTPUT
            fi

            if ./scripts/has-git-diff-at-path.sh qemu "$BASE_REF"; then
              echo "qemu=true" >> $GITHUB_OUTPUT
              ANY_CHANGES=true
            else
              echo "qemu=false" >> $GITHUB_OUTPUT
            fi

            if ./scripts/has-git-diff-at-path.sh cloud-hypervisor "$BASE_REF"; then
              echo "cloud-hypervisor=true" >> $GITHUB_OUTPUT
              ANY_CHANGES=true
            else
              echo "cloud-hypervisor=false" >> $GITHUB_OUTPUT
            fi

            if ./scripts/has-git-diff-at-path.sh browser "$BASE_REF"; then
              echo "browser=true" >> $GITHUB_OUTPUT
              ANY_CHANGES=true
            else
              echo "browser=false" >> $GITHUB_OUTPUT
            fi
          fi

          if ./scripts/has-git-diff-at-path.sh dnsmasq_exporter "$BASE_REF"; then
            echo "dnsmasq-exporter=true" >> $GITHUB_OUTPUT
            ANY_CHANGES=true
          else
            echo "dnsmasq-exporter=false" >> $GITHUB_OUTPUT
          fi

          if ./scripts/has-git-diff-at-path.sh sqitch-pg "$BASE_REF"; then
            echo "sqitch-pg=true" >> $GITHUB_OUTPUT
            ANY_CHANGES=true
          else
            echo "sqitch-pg=false" >> $GITHUB_OUTPUT
          fi

          if ./scripts/has-git-diff-at-path.sh wait-for-pg "$BASE_REF"; then
            echo "wait-for-pg=true" >> $GITHUB_OUTPUT
            ANY_CHANGES=true
          else
            echo "wait-for-pg=false" >> $GITHUB_OUTPUT
          fi

          echo "any-changes=$ANY_CHANGES" >> $GITHUB_OUTPUT

      - name: Generate build matrices
        id: matrices
        run: |
          echo "upstream_tags_json=$(echo "$UPSTREAM_TAGS" | jq -Rc 'split(" ")')" >> $GITHUB_OUTPUT

      # Workflow env does not reach reusable workflows; they receive these
      # settings as JSON instead.
      - name: Export build settings
        id: settings
        run: |
          echo "json=$(jq -nc '{
            UPSTREAM_TAGS: env.UPSTREAM_TAGS,
            LATEST_TAG: env.LATEST_TAG,
            NODEJS_VERSIONS: env.NODEJS_VERSIONS,
            DEFAULT_NODEJS_VERSION: env.DEFAULT_NODEJS_VERSION,
            TZ: env.TZ,
            APT_MIRROR: env.APT_MIRROR,
            QEMU_VERSIONS: env.QEMU_VERSIONS,
            QEMU_LATEST: env.QEMU_LATEST,
            CH_VERSIONS: env.CH_VERSIONS,
            CH_LATEST: env.CH_LATEST
          }')" >> $GITHUB_OUTPUT

  # --- Ubuntu base image (all ubuntu-derived images depend on this) ---
  # Each arch builds natively on its own runner, pushes to arch-suffixed tags.

  build-ubuntu-base:
    name: Build ubuntu:${{ matrix.upstream_tag }}
    needs: detect-changes
    if: needs.detect-changes.outputs.ubuntu == 'true'
    strategy:
      fail-fast: false
      matrix:
        upstream_tag: ${{ fromJSON(needs.detect-changes.outputs.upstream-tags-json) }}
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: ubuntu
      settings: ${{ needs.detect-changes.outputs.settings }}
      upstream-tags: ${{ matrix.upstream_tag }}
      pull-slot: ${{ strategy.job-index }}
    secrets: inherit

  # Merges also check the change flag: in run 40308606353 a skipped
  # reusable-workflow build did not skip its dependent merge.
  merge-ubuntu-base:
    name: Merge ubuntu manifests
    needs: [detect-changes, build-ubuntu-base]
    if: |
      needs.build-ubuntu-base.result == 'success' &&
      needs.detect-changes.outputs.ubuntu == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-ubuntu
      settings: ${{ needs.build-ubuntu-base.outputs.settings }}
      image: ubuntu
      readme-path: ubuntu/README.md
    secrets: inherit

  # --- Ubuntu variants (parallel, depend on base build only) ---

  build-ubuntu-nodejs:
    name: Build ubuntu-nodejs
    needs: [detect-changes, build-ubuntu-base]
    if: |
      always() &&
      needs.detect-changes.outputs.ubuntu == 'true' &&
      (needs.build-ubuntu-base.result == 'success' || needs.build-ubuntu-base.result == 'skipped')
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: ubuntu-nodejs
      settings: ${{ needs.detect-changes.outputs.settings }}
    secrets: inherit

  merge-ubuntu-nodejs:
    name: Merge ubuntu-nodejs manifests
    needs: [detect-changes, build-ubuntu-nodejs]
    if: |
      needs.build-ubuntu-nodejs.result == 'success' &&
      needs.detect-changes.outputs.ubuntu == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-ubuntu-nodejs
      settings: ${{ needs.build-ubuntu-nodejs.outputs.settings }}
    secrets: inherit

  build-ubuntu-rust:
    name: Build ubuntu-rust
    needs: [detect-changes, build-ubuntu-base]
    if: |
      always() &&
      needs.detect-changes.outputs.ubuntu == 'true' &&
      (needs.build-ubuntu-base.result == 'success' || needs.build-ubuntu-base.result == 'skipped')
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: ubuntu-rust
      settings: ${{ needs.detect-changes.outputs.settings }}
    secrets: inherit

  merge-ubuntu-rust:
    name: Merge ubuntu-rust manifests
    needs: [detect-changes, build-ubuntu-rust]
    if: |
      needs.build-ubuntu-rust.result == 'success' &&
      needs.detect-changes.outputs.ubuntu == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-ubuntu-rust
      settings: ${{ needs.build-ubuntu-rust.outputs.settings }}
    secrets: inherit

  build-ubuntu-bun:
    name: Build ubuntu-bun
    needs: [detect-changes, build-ubuntu-base]
    if: |
      always() &&
      needs.detect-changes.outputs.ubuntu == 'true' &&
      (needs.build-ubuntu-base.result == 'success' || needs.build-ubuntu-base.result == 'skipped')
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: ubuntu-bun
      settings: ${{ needs.detect-changes.outputs.settings }}
    secrets: inherit

  merge-ubuntu-bun:
    name: Merge ubuntu-bun manifests
    needs: [detect-changes, build-ubuntu-bun]
    if: |
      needs.build-ubuntu-bun.result == 'success' &&
      needs.detect-changes.outputs.ubuntu == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-ubuntu-bun
      settings: ${{ needs.build-ubuntu-bun.outputs.settings }}
    secrets: inherit

  # --- GeoIP: download databases once, then build tags per-arch ---

  prepare-geoip-databases:
    name: Prepare GeoIP databases
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.ubuntu-geoip == 'true' ||
      github.event_name != 'pull_request'
    environment: action-build-and-push
    outputs:
      maxmind-changed: ${{ steps.maxmind.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore MaxMind versions cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: ubuntu-geoip/MAXMIND_VERSIONS
          key: maxmind-versions-
          restore-keys: |
            maxmind-versions-

      - name: Check MaxMind database versions
        if: github.event_name != 'pull_request'
        id: maxmind
        run: |
          OUTPUT=$(./scripts/get-and-compare-maxmind-versions.sh \
            --key "${{ secrets.MAXMIND_LICENSE_KEY }}" \
            --output /tmp/maxmind_versions_upstream.txt \
            --input ubuntu-geoip/MAXMIND_VERSIONS)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "changed=true"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore MaxMind databases cache
        uses: actions/cache/restore@v5
        with:
          path: ubuntu-geoip/databases
          key: maxmind-db-
          restore-keys: |
            maxmind-db-

      - name: Download MaxMind databases
        if: steps.maxmind.outputs.changed == 'true'
        run: |
          mkdir -p ubuntu-geoip/databases
          for edition in GeoLite2-Country GeoLite2-City GeoLite2-ASN; do
            echo "Downloading ${edition}..."
            wget -q "https://download.maxmind.com/app/geoip_download?edition_id=${edition}&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz" \
              -O "/tmp/${edition}.tar.gz"
            tar -xzf "/tmp/${edition}.tar.gz" -C /tmp
            mv /tmp/${edition}*/${edition}.mmdb ubuntu-geoip/databases/
            rm -rf /tmp/${edition}*
          done
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

      - name: Verify databases available
        run: |
          for db in GeoLite2-Country GeoLite2-City GeoLite2-ASN; do
            if [ ! -f "ubuntu-geoip/databases/$db.mmdb" ]; then
              echo "ERROR: $db.mmdb not found" >&2
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                echo "In PRs, databases must be available from Actions cache" >&2
              fi
              exit 1
            fi
          done
          echo "All MaxMind databases present"
          ls -lh ubuntu-geoip/databases/*.mmdb

      - name: Update MaxMind versions file
        if: github.event_name != 'pull_request' && steps.maxmind.outputs.changed == 'true'
        run: cp /tmp/maxmind_versions_upstream.txt ubuntu-geoip/MAXMIND_VERSIONS

      - name: Save MaxMind versions cache
        if: github.event_name != 'pull_request' && steps.maxmind.outputs.changed == 'true'
        uses: actions/cache/save@v5
        with:
          path: ubuntu-geoip/MAXMIND_VERSIONS
          key: maxmind-versions-${{ github.run_id }}

      - name: Save MaxMind databases cache
        if: github.event_name != 'pull_request' && steps.maxmind.outputs.changed == 'true'
        uses: actions/cache/save@v5
        with:
          path: ubuntu-geoip/databases
          key: maxmind-db-${{ github.run_id }}

  build-ubuntu-geoip:
    name: Build ubuntu-geoip:${{ matrix.upstream_tag }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [detect-changes, build-ubuntu-base, prepare-geoip-databases]
    if: |
      always() &&
      (needs.detect-changes.outputs.ubuntu-geoip == 'true' || needs.prepare-geoip-databases.outputs.maxmind-changed == 'true') &&
      needs.prepare-geoip-databases.result == 'success' &&
      (needs.build-ubuntu-base.result == 'success' || needs.build-ubuntu-base.result == 'skipped')
    environment: action-build-and-push
    outputs:
      settings: ${{ needs.detect-changes.outputs.settings }}
    strategy:
      fail-fast: false
      matrix:
        upstream_tag: ${{ fromJSON(needs.detect-changes.outputs.upstream-tags-json) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: -amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: -arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: ./buildkitd.toml

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Restore MaxMind versions from cache
        uses: actions/cache/restore@v5
        with:
          path: ubuntu-geoip/MAXMIND_VERSIONS
          key: maxmind-versions-
          restore-keys: |
            maxmind-versions-

      - name: Restore GeoIP databases from cache
        uses: actions/cache/restore@v5
        with:
          path: ubuntu-geoip/databases
          key: maxmind-db-
          restore-keys: |
            maxmind-db-

      - name: Build and push ubuntu-geoip:${{ matrix.upstream_tag }}
        run: |
          make ubuntu-geoip-build \
            UPSTREAM_TAGS="${{ matrix.upstream_tag }}" \
            PLATFORM="${{ matrix.platform }}" \
            TAG_SUFFIX="${{ matrix.suffix }}" \
            LATEST_TAG="$LATEST_TAG" \
            PUSH="${{ github.event_name != 'pull_request' && 'true' || 'false' }}"

  merge-ubuntu-geoip:
    name: Merge ubuntu-geoip manifests
    needs: build-ubuntu-geoip
    if: |
      always() &&
      needs.build-ubuntu-geoip.result == 'success' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-ubuntu-geoip
      settings: ${{ needs.build-ubuntu-geoip.outputs.settings }}
      image: ubuntu-geoip
      readme-path: ubuntu-geoip/README.md
    secrets: inherit

  # --- Images that depend on ubuntu base (not nodejs/rust) ---

  build-dnsmasq:
    name: Build dnsmasq
    needs: [detect-changes, build-ubuntu-base]
    if: |
      always() &&
      needs.detect-changes.outputs.dnsmasq == 'true' &&
      (needs.build-ubuntu-base.result == 'success' || needs.build-ubuntu-base.result == 'skipped')
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: dnsmasq
      settings: ${{ needs.detect-changes.outputs.settings }}
    secrets: inherit

  merge-dnsmasq:
    name: Merge dnsmasq manifests
    needs: [detect-changes, build-dnsmasq]
    if: |
      always() &&
      needs.build-dnsmasq.result == 'success' &&
      needs.detect-changes.outputs.dnsmasq == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-dnsmasq
      settings: ${{ needs.build-dnsmasq.outputs.settings }}
      image: dnsmasq
      readme-path: dnsmasq/README.md
    secrets: inherit

  build-qemu:
    name: Build qemu
    needs: [detect-changes, build-ubuntu-base]
    if: |
      always() &&
      needs.detect-changes.outputs.qemu == 'true' &&
      (needs.build-ubuntu-base.result == 'success' || needs.build-ubuntu-base.result == 'skipped')
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: qemu
      settings: ${{ needs.detect-changes.outputs.settings }}
    secrets: inherit

  merge-qemu:
    name: Merge qemu manifests
    needs: [detect-changes, build-qemu]
    if: |
      always() &&
      needs.build-qemu.result == 'success' &&
      needs.detect-changes.outputs.qemu == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-qemu
      settings: ${{ needs.build-qemu.outputs.settings }}
      image: qemu
      readme-path: qemu/README.md
    secrets: inherit

  build-cloud-hypervisor:
    name: Build cloud-hypervisor
    needs: [detect-changes, build-ubuntu-base]
    if: |
      always() &&
      needs.detect-changes.outputs.cloud-hypervisor == 'true' &&
      (needs.build-ubuntu-base.result == 'success' || needs.build-ubuntu-base.result == 'skipped')
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: cloud-hypervisor
      settings: ${{ needs.detect-changes.outputs.settings }}
    secrets: inherit

  merge-cloud-hypervisor:
    name: Merge cloud-hypervisor manifests
    needs: [detect-changes, build-cloud-hypervisor]
    if: |
      always() &&
      needs.build-cloud-hypervisor.result == 'success' &&
      needs.detect-changes.outputs.cloud-hypervisor == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-cloud-hypervisor
      settings: ${{ needs.build-cloud-hypervisor.outputs.settings }}
      image: cloud-hypervisor
      readme-path: cloud-hypervisor/README.md
    secrets: inherit

  # --- Shadowsocks depends on ubuntu:rust ---

  build-shadowsocks:
    name: Build shadowsocks
    needs: [detect-changes, build-ubuntu-base, build-ubuntu-rust]
    if: |
      always() &&
      needs.detect-changes.outputs.shadowsocks == 'true' &&
      (needs.build-ubuntu-base.result == 'success' || needs.build-ubuntu-base.result == 'skipped') &&
      (needs.build-ubuntu-rust.result == 'success' || needs.build-ubuntu-rust.result == 'skipped')
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: shadowsocks
      settings: ${{ needs.detect-changes.outputs.settings }}
    secrets: inherit

  merge-shadowsocks:
    name: Merge shadowsocks manifests
    needs: [detect-changes, build-shadowsocks]
    if: |
      always() &&
      needs.build-shadowsocks.result == 'success' &&
      needs.detect-changes.outputs.shadowsocks == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-shadowsocks
      settings: ${{ needs.build-shadowsocks.outputs.settings }}
      image: shadowsocks
      readme-path: shadowsocks/README.md
    secrets: inherit

  # --- Browser depends on ubuntu:nodejs ---

  build-browser:
    name: Build browser
    needs: [detect-changes, build-ubuntu-nodejs]
    if: |
      always() &&
      needs.detect-changes.outputs.browser == 'true' &&
      (needs.build-ubuntu-nodejs.result == 'success' || needs.build-ubuntu-nodejs.result == 'skipped')
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: browser
      settings: ${{ needs.detect-changes.outputs.settings }}
    secrets: inherit

  merge-browser:
    name: Merge browser manifests
    needs: [detect-changes, build-browser]
    if: |
      always() &&
      needs.build-browser.result == 'success' &&
      needs.detect-changes.outputs.browser == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-browser
      settings: ${{ needs.build-browser.outputs.settings }}
      image: browser
      readme-path: browser/README.md
    secrets: inherit

  # --- Independent images (no ubuntu dependency) ---
  # These pull Docker Hub images at the same time as the ubuntu base builds,
  # which take pull slots 0-2.

  build-dnsmasq-exporter:
    name: Build dnsmasq_exporter
    needs: detect-changes
    if: needs.detect-changes.outputs.dnsmasq-exporter == 'true'
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: dnsmasq-exporter
      settings: ${{ needs.detect-changes.outputs.settings }}
      pull-slot: 3
    secrets: inherit

  merge-dnsmasq-exporter:
    name: Merge dnsmasq_exporter manifests
    needs: [detect-changes, build-dnsmasq-exporter]
    if: |
      always() &&
      needs.build-dnsmasq-exporter.result == 'success' &&
      needs.detect-changes.outputs.dnsmasq-exporter == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-dnsmasq-exporter
      settings: ${{ needs.build-dnsmasq-exporter.outputs.settings }}
      image: dnsmasq_exporter
      readme-path: dnsmasq_exporter/README.md
    secrets: inherit

  build-sqitch-pg:
    name: Build sqitch-pg
    needs: detect-changes
    if: needs.detect-changes.outputs.sqitch-pg == 'true'
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: sqitch-pg
      settings: ${{ needs.detect-changes.outputs.settings }}
      pull-slot: 4
    secrets: inherit

  merge-sqitch-pg:
    name: Merge sqitch-pg manifests
    needs: [detect-changes, build-sqitch-pg]
    if: |
      always() &&
      needs.build-sqitch-pg.result == 'success' &&
      needs.detect-changes.outputs.sqitch-pg == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-sqitch-pg
      settings: ${{ needs.build-sqitch-pg.outputs.settings }}
      image: sqitch-pg
      readme-path: sqitch-pg/README.md
    secrets: inherit

  build-wait-for-pg:
    name: Build wait-for-pg
    needs: detect-changes
    if: needs.detect-changes.outputs.wait-for-pg == 'true'
    uses: ./.github/workflows/build-per-arch-images.yml
    with:
      make-target: wait-for-pg
      settings: ${{ needs.detect-changes.outputs.settings }}
      pull-slot: 5
    secrets: inherit

  merge-wait-for-pg:
    name: Merge wait-for-pg manifests
    needs: [detect-changes, build-wait-for-pg]
    if: |
      always() &&
      needs.build-wait-for-pg.result == 'success' &&
      needs.detect-changes.outputs.wait-for-pg == 'true' &&
      github.event_name != 'pull_request'
    uses: ./.github/workflows/merge-multi-arch-manifest.yml
    with:
      make-target: merge-wait-for-pg
      settings: ${{ needs.build-wait-for-pg.outputs.settings }}
      image: wait-for-pg
      readme-path: wait-for-pg/README.md
    secrets: inherit
