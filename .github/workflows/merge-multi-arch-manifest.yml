name: Merge multi-arch manifest

on:
  workflow_call:
    inputs:
      make-target:
        description: 'Make target that merges the arch-suffixed tags into multi-arch manifests'
        required: true
        type: string
      settings:
        description: 'JSON of the calling workflow env (the build job settings output)'
        required: true
        type: string
      image:
        description: 'DockerHub repository name that receives the README'
        required: false
        type: string
        default: ''
      readme-path:
        description: 'README synced to the DockerHub repository; empty skips the sync'
        required: false
        type: string
        default: ''

jobs:
  merge:
    name: Merge
    runs-on: ubuntu-latest
    environment: action-build-and-push
    steps:
      # make reads these from the environment. jq -e fails the job when
      # settings is empty, invalid, or {}, or when a setting is null.
      - name: Load build settings
        run: echo "$SETTINGS" | jq -er 'to_entries[] | if .value == null then error("\(.key) is not set") else "\(.key)=\(.value)" end' >> "$GITHUB_ENV"
        env:
          SETTINGS: ${{ inputs.settings }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Merge manifests
        run: make "$MAKE_TARGET"
        env:
          MAKE_TARGET: ${{ inputs.make-target }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sync README to DockerHub
        if: inputs.readme-path != ''
        run: ./scripts/sync-readme.sh "$README_PATH" "$DOCKERHUB_USERNAME/$IMAGE"
        env:
          README_PATH: ${{ inputs.readme-path }}
          IMAGE: ${{ inputs.image }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
